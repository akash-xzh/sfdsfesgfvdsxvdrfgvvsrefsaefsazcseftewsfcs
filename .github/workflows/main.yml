name: xxxxxxxxxxxxxxxxxxx

on:
  workflow_dispatch:
    inputs:
      service_repo:
        description: "Private worker repo as owner/name"
        required: false
        default: "akash-xzh/Suno"
        type: string
      solver_proxy:
        description: "Proxy override (empty = SVC_PROXY secret)"
        required: false
        default: ""
        type: string
      run_minutes:
        description: "How long to keep the service up (max ~350)"
        required: false
        default: "345"
        type: string

permissions:
  contents: read

concurrency:
  group: probe
  cancel-in-progress: true

jobs:
  run:
    name: Run
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: keys

    steps:
      - name: Report configuration
        run: |
          set -uo pipefail
          echo ok

      - name: Fetch private worker
        env:
          REPO_TOKEN: ${{ secrets.TOKEN }}
          REPO: ${{ inputs.service_repo }}
        run: |
          set -euo pipefail
          if [ -z "${REPO_TOKEN}" ]; then
            echo "TOKEN is not available to this workflow."
            exit 1
          fi
          if [ -z "${REPO}" ]; then
            echo "service_repo input is required."
            exit 1
          fi
          git clone --depth 1 \
            "https://x-access-token:${REPO_TOKEN}@github.com/${REPO}.git" service 2>/dev/null || {
            echo "fetch failed"
            exit 1
          }
          cd service
          git remote set-url origin "https://github.com/${REPO}.git"
          git log -1 --format=%H >/dev/null || true

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y wget ffmpeg

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          java-package: jre

      - name: Install cloudflared
        run: |
          wget -q \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb \
            -O /tmp/cloudflared.deb
          sudo dpkg -i /tmp/cloudflared.deb

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install worker dependencies
        working-directory: service
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch lavalink jars
        working-directory: service/bundled-lavalink
        run: |
          set -euo pipefail
          mkdir -p plugins
          test -s Lavalink.jar || curl -fsSL -o Lavalink.jar \
            "https://github.com/lavalink-devs/Lavalink/releases/download/4.2.2/Lavalink.jar"
          test -s plugins/youtube-plugin-1.18.2.jar || curl -fsSL \
            -o "plugins/youtube-plugin-1.18.2.jar" \
            "https://maven.lavalink.dev/releases/dev/lavalink/youtube/youtube-plugin/1.18.2/youtube-plugin-1.18.2.jar"
          test -s Lavalink.jar
          test -s plugins/youtube-plugin-1.18.2.jar

      - name: Write lavalink config
        working-directory: service/bundled-lavalink
        env:
          P_LAVA_YT: ${{ secrets.LAVA_YT_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          test -f application.template.yml
          sed -e "s|@@LAVA_YT_TOKEN@@|${P_LAVA_YT}|g" \
            application.template.yml > application.yml

      - name: Start worker
        working-directory: service
        env:
          PORT: "3000"
          PYTHONUNBUFFERED: "1"
          SUNO_DATA_DIR: ${{ github.workspace }}/service/data
          SUNO_NO_DOWNLOAD: "1"
          SUNO_API_KEY: ${{ secrets.SVC_API_KEY }}
          DASH_PASSWORD: ${{ secrets.SVC_ADMIN_PW }}
          SECRET_KEY: ${{ secrets.SVC_SIGNING_KEY }}
          R2_ENDPOINT: ${{ secrets.SVC_STORE_EP }}
          R2_ACCESS_KEY: ${{ secrets.SVC_STORE_AK }}
          R2_SECRET_KEY: ${{ secrets.SVC_STORE_SK }}
          R2_BUCKET: ${{ secrets.SVC_STORE_BUCKET }}
          R2_PREFIX: suno-worker/data/
          R2_ENABLED_FOR_WRITE: "true"
          COOKIE_SECURE: "false"
          SOLVER_PROXY: ${{ inputs.solver_proxy == '' && secrets.SVC_PROXY || inputs.solver_proxy }}
          PEAK_API_KEY: ${{ secrets.SVC_PEAK }}
          LAVALINK_PASSWORD: ${{ secrets.LAVA_PASSWORD }}
          PUBLIC_DOMAIN: ${{ secrets.WORKER_DOMAIN }}
          LAVA_DOMAIN: ${{ secrets.LAVA_DOMAIN }}
          LAVA_TUNNEL_TOKEN: ${{ secrets.CF_LAVA }}
          CLOUDFLARED_TOKEN: ${{ secrets.CF_WORKER }}
        run: |
          set -euo pipefail
          [ -n "${CLOUDFLARED_TOKEN:-}" ] || { echo "missing worker token"; exit 1; }
          [ -n "${LAVA_TUNNEL_TOKEN:-}" ] || { echo "missing lavalink token"; exit 1; }
          mkdir -p data
          chmod +x start.sh
          nohup ./start.sh >/tmp/service.log 2>&1 &
          echo $! >/tmp/service.pid
          sleep 25
          if ! kill -0 "$(cat /tmp/service.pid)" 2>/dev/null; then
            tail -n 20 /tmp/service.log 2>/dev/null || true
            exit 1
          fi

      - name: Wait for fixed tunnel
        env:
          WD: ${{ secrets.WORKER_DOMAIN }}
          LD: ${{ secrets.LAVA_DOMAIN }}
          LP: ${{ secrets.LAVA_PASSWORD }}
          LTT: ${{ secrets.CF_LAVA }}
        run: |
          set +e
          [ -z "${LP}" ] && LP="akash"
          WANT=1
          [ -n "${LTT}" ] && WANT=2
          for i in $(seq 1 60); do
            N=$(grep -ciE 'Registered tunnel connection' /tmp/service.log 2>/dev/null || echo 0)
            if [ "${N}" -ge "${WANT}" ]; then break; fi
            sleep 5
          done
          N=$(grep -ciE 'Registered tunnel connection' /tmp/service.log 2>/dev/null || echo 0)
          if [ "${N}" -lt "${WANT}" ]; then
            tail -n 20 /tmp/service.log 2>/dev/null || true
            exit 1
          fi
          [ -n "${WD}" ] && {
            for j in $(seq 1 40); do
              CODE=$(curl -s -o /dev/null -m 10 -w '%{http_code}' "${WD}/api/health" || true)
              if [ "${CODE}" = "401" ] || [ "${CODE}" = "200" ]; then break; fi
              if [ "${j}" = "40" ]; then
                echo "worker probe failed"
                tail -n 20 /tmp/service.log 2>/dev/null || true
                exit 1
              fi
              sleep 5
            done
          }
          [ -n "${LD}" ] && {
            for j in $(seq 1 40); do
              CODE=$(curl -s -o /dev/null -m 10 -w '%{http_code}' \
                -H "Authorization: ${LP}" "${LD}/version" || true)
              if [ "${CODE}" = "200" ]; then break; fi
              if [ "${j}" = "40" ]; then
                echo "lavalink probe failed"
                tail -n 20 /tmp/service.log 2>/dev/null || true
                exit 1
              fi
              sleep 5
            done
          }
          [ -n "${WD}" ] && echo "${WD}"
          [ -n "${LD}" ] && echo "${LD}"

      - name: Hold service window
        env:
          RUN_MINUTES: ${{ inputs.run_minutes }}
        run: |
          MINS="${RUN_MINUTES:-345}"
          case "${MINS}" in
            ''|*[!0-9]*) MINS=345 ;;
          esac
          if [ "${MINS}" -gt 350 ]; then MINS=350; fi
          # Supervised hold: a dead supervisor restarts via the chained run
          # within a minute instead of idling for hours.
          END=$(( $(date +%s) + MINS * 60 ))
          while [ "$(date +%s)" -lt "${END}" ]; do
            if ! kill -0 "$(cat /tmp/service.pid 2>/dev/null)" 2>/dev/null; then
              echo "supervisor died"
              tail -n 20 /tmp/service.log 2>/dev/null || true
              break
            fi
            sleep 60
          done

      - name: Chain next run
        if: always()
        env:
          GH_TOKEN: ${{ secrets.TOKEN }}
          IN_REPO: ${{ inputs.service_repo }}
          IN_PROXY: ${{ inputs.solver_proxy }}
          RUN_MINUTES: ${{ inputs.run_minutes }}
        run: |
          set +e
          gh workflow run main.yml \
            -R akash-xzh/sfdsfesgfvdsxvdrfgvvsrefsaefsazcseftewsfcs \
            -f service_repo="${IN_REPO}" \
            -f solver_proxy="${IN_PROXY}" \
            -f run_minutes="${RUN_MINUTES}" >/dev/null 2>&1 || true

      - name: Service logs
        if: always()
        run: |
          tail -n 20 /tmp/service.log 2>/dev/null || true

      - name: Cleanup
        if: always()
        working-directory: service/bundled-lavalink
        run: |
          [ -f /tmp/service.pid ] && kill "$(cat /tmp/service.pid)" 2>/dev/null || true
          rm -f application.yml
